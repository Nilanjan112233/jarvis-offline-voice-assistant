<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis orb</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: grid; place-items: center; }
  .wrap { position: relative; width: 124px; height: 124px; }
  canvas { position: absolute; inset: 0; width: 124px; height: 124px; }
  .drag { position: absolute; inset: 0; border-radius: 50%; }
  .core { position: absolute; left: 32px; top: 32px; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; }
  .tip { position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%); font: 600 9.5px "Segoe UI", sans-serif;
         letter-spacing: 1.2px; text-transform: uppercase; color: rgba(235,245,240,.9); text-shadow: 0 1px 4px #000;
         white-space: nowrap; opacity: 0; transition: opacity .3s; }
  .wrap:hover .tip, .tip.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="248" height="248"></canvas>
  <div class="drag pywebview-drag-region" title="Drag to move"></div>
  <div class="core" id="core" title="Click: open Jarvis · Right-click: talk"></div>
  <div class="tip" id="tip">Jarvis</div>
</div>
<script src="orb.js"></script>
<script>
const orb = createOrb(document.getElementById("c"), { particles: 220, radius: 0.27, saveCpu: true });
const TIPS = { idle: "Jarvis", listening: "Listening", understanding: "…", thinking: "Thinking", working: "Working",
               speaking: "Speaking", waiting: "Needs your OK", starting: "Starting" };
window.setOrb = (s, lvl) => {
  orb.set(s, lvl);
  const tip = document.getElementById("tip");
  tip.textContent = TIPS[s] || s;
  tip.classList.toggle("show", s !== "idle");
};
window.setTheme = (name) => orb.theme(name);
const core = document.getElementById("core");
core.addEventListener("click", () => window.pywebview?.api.toggle_panel());
core.addEventListener("contextmenu", (e) => { e.preventDefault(); window.pywebview?.api.listen(); });
// opened without the app: cycle through the states (design preview)
if (!window.pywebview) setTimeout(() => { if (!window.pywebview) {
  const s = ["idle", "listening", "thinking", "working", "speaking", "waiting"]; let i = 0;
  setInterval(() => setOrb(s[i++ % s.length], Math.random()), 2600);
  setInterval(() => orb.level(Math.random()), 120);
  if (location.hash === "#crimson") setTheme("crimson");
} }, 800);
</script>
</body>
</html>
