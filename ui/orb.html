<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis orb</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: grid; place-items: center; }
  .wrap { position: relative; width: 120px; height: 120px; }
  canvas { position: absolute; inset: 0; width: 120px; height: 120px; }
  .drag { position: absolute; inset: 0; border-radius: 50%; }
  .core { position: absolute; left: 30px; top: 30px; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; }
  .tip { position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%); font: 600 10px "Segoe UI", sans-serif;
         color: rgba(232,237,246,.85); text-shadow: 0 1px 4px #000; white-space: nowrap; opacity: 0; transition: opacity .3s; }
  .wrap:hover .tip, .tip.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="240" height="240"></canvas>
  <div class="drag pywebview-drag-region" title="Drag to move"></div>
  <div class="core" id="core" title="Click: open Jarvis · Right-click: talk"></div>
  <div class="tip" id="tip">Jarvis</div>
</div>
<script>
// Animated orb. States: idle (calm cyan breathing), listening (rose, reacts to mic level),
// thinking/working (violet swirl), speaking (bright cyan pulse), waiting (amber), starting (dim).
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const COLORS = {
  idle: ["#38e1ff", "#4f7cff"], listening: ["#ff4f8b", "#ff9ab9"], understanding: ["#ff9ab9", "#9b6bff"],
  thinking: ["#9b6bff", "#4f7cff"], working: ["#9b6bff", "#38e1ff"], speaking: ["#38e1ff", "#9ff3ff"],
  waiting: ["#ffb547", "#ff7a45"], starting: ["#3b4a66", "#26324a"],
};
let state = "starting", level = 0, t = 0, cur = [...COLORS.starting.map(hex)];
function hex(h) { return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); }
function mix(a, b, k) { return a.map((v, i) => v + (b[i] - v) * k); }
function rgba(c, a) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }

window.setOrb = (s, lvl) => { state = s; if (lvl != null) level = lvl; document.getElementById("tip").textContent =
  { idle: "Jarvis", listening: "Listening…", thinking: "Thinking…", working: "Working…", speaking: "Speaking…", waiting: "Needs your OK", starting: "Starting…", understanding: "…" }[s] || s; };

function draw() {
  t += 1 / 60;
  const target = COLORS[state] || COLORS.idle;
  cur = [mix(cur[0], hex(target[0]), .06), mix(cur[1], hex(target[1]), .06)];
  const W = 240, C = W / 2;
  ctx.clearRect(0, 0, W, W);
  const speed = { thinking: 2.2, working: 2.6, listening: 1.4, speaking: 1.6, understanding: 2 }[state] || .6;
  let pulse = state === "speaking" ? .06 * Math.sin(t * 9) + .04 * Math.sin(t * 14)
            : state === "listening" ? Math.min(level, 1) * .14 : .025 * Math.sin(t * 1.6);
  const R = 44 * (1 + pulse);

  // outer glow
  let g = ctx.createRadialGradient(C, C, R * .6, C, C, R * 2.3);
  g.addColorStop(0, rgba(cur[0], .42)); g.addColorStop(1, rgba(cur[0], 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(C, C, R * 2.3, 0, 7); ctx.fill();

  // rotating rings
  for (let i = 0; i < 3; i++) {
    ctx.save(); ctx.translate(C, C); ctx.rotate(t * speed * (i % 2 ? -1 : 1) * (0.6 + i * .3));
    ctx.strokeStyle = rgba(i % 2 ? cur[1] : cur[0], .55 - i * .12); ctx.lineWidth = 2.2 - i * .5;
    ctx.beginPath(); ctx.ellipse(0, 0, R * (1.28 + i * .14), R * (1.12 + i * .1), 0, 0.2 + i, 4.2 + i); ctx.stroke();
    ctx.restore();
  }

  // swirling core blobs
  ctx.save(); ctx.beginPath(); ctx.arc(C, C, R, 0, 7); ctx.clip();
  g = ctx.createRadialGradient(C - R * .3, C - R * .35, 2, C, C, R);
  g.addColorStop(0, "rgba(255,255,255,.95)"); g.addColorStop(.25, rgba(cur[1], .95)); g.addColorStop(.7, rgba(cur[0], .9)); g.addColorStop(1, "rgba(8,14,32,1)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);
  for (let i = 0; i < 4; i++) {
    const a = t * speed * (1 + i * .35) + i * 1.7, r = R * .45;
    const x = C + Math.cos(a) * r * .6, y = C + Math.sin(a * 1.3) * r * .5;
    const bg = ctx.createRadialGradient(x, y, 0, x, y, R * .7);
    bg.addColorStop(0, rgba(i % 2 ? cur[0] : cur[1], .55)); bg.addColorStop(1, rgba(cur[0], 0));
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, W);
  }
  ctx.restore();

  // rim
  ctx.strokeStyle = rgba(cur[1], .7); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(C, C, R, 0, 7); ctx.stroke();
  requestAnimationFrame(draw);
}
draw();

const core = document.getElementById("core");
core.addEventListener("click", () => window.pywebview?.api.toggle_panel());
core.addEventListener("contextmenu", (e) => { e.preventDefault(); window.pywebview?.api.listen(); });
if (!window.pywebview) setTimeout(() => { if (!window.pywebview) { const s = Object.keys(COLORS); let i = 0; setInterval(() => setOrb(s[i++ % s.length], Math.random()), 1800); } }, 1500);
</script>
</body>
</html>
